<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Dash Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #000;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Carga de imágenes
    const imgFondo = new Image(); imgFondo.src = 'fondo.jpeg.jpeg';
    const imgJugador = new Image(); imgJugador.src = 'cubo.jpeg.jpeg';
    const imgPincho = new Image(); imgPincho.src = 'pincho.jpeg.jpeg';

    // Sistema de Música de Fondo (Sintetizador Web Audio)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let musicaIniciada = false;

    function reproducirMusica() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (musicaIniciada) return;
        
        musicaIniciada = true;
        
        // Secuencia de notas estilo Geometry Dash (8-bit)
        const notas = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
        let paso = 0;

        setInterval(() => {
            if (gameOver || !juegoIniciado) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notas[paso % notas.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
                paso++;
            } catch(e){}
        }, 150);
    }

    // Variables del juego
    let juegoIniciado = false;
    let gameOver = false;
    let score = 0;
    const sueloY = 310;

    // Jugador
    const cubo = {
        x: 80,
        y: sueloY,
        ancho: 40,
        alto: 40,
        vy: 0,
        gravedad: 0.8,
        fuerzaSalto: -13,
        enSuelo: true
    };

    let obstaculos = [];
    let frames = 0;

    // Controles
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') interactuar();
    });
    document.getElementById('gameContainer').addEventListener('mousedown', interactuar);
    document.getElementById('gameContainer').addEventListener('touchstart', (e) => {
        e.preventDefault();
        interactuar();
    });

    function interactuar() {
        reproducirMusica();
        if (!juegoIniciado || gameOver) {
            reiniciarJuego();
            return;
        }
        
        if (cubo.enSuelo) {
            cubo.vy = cubo.fuerzaSalto;
            cubo.enSuelo = false;
        } else {
            obstaculos.forEach(obs => {
                if (obs.tipo === 'esfera' && !obs.usada) {
                    if (colisionConObjeto(cubo, obs)) {
                        cubo.vy = cubo.fuerzaSalto * 1.1;
                        obs.usada = true;
                    }
                }
            });
        }
    }

    function crearObstaculo() {
        const opciones = ['pinchoSuelo', 'pinchoTecho', 'bloque', 'esfera'];
        const tipoElegido = opciones[Math.floor(Math.random() * opciones.length)];

        if (tipoElegido === 'pinchoSuelo') {
            obstaculos.push({ x: canvas.width, y: sueloY, ancho: 40, alto: 40, tipo: 'pinchoSuelo' });
        } 
        else if (tipoElegido === 'pinchoTecho') {
            obstaculos.push({ x: canvas.width, y: 0, ancho: 40, alto: 40, tipo: 'pinchoTecho' });
        } 
        else if (tipoElegido === 'bloque') {
            obstaculos.push({ x: canvas.width, y: sueloY - 40, ancho: 50, alto: 80, tipo: 'bloque' });
        } 
        else if (tipoElegido === 'esfera') {
            obstaculos.push({ x: canvas.width, y: sueloY - 90, ancho: 30, alto: 30, tipo: 'esfera', usada: false });
        }
    }

    function actualizar() {
        if (!juegoIniciado || gameOver) return;

        frames++;
        if (frames % 90 === 0) {
            crearObstaculo();
        }

        // Física del Cubo
        cubo.vy += cubo.gravedad;
        cubo.y += cubo.vy;

        // Suelo principal
        if (cubo.y >= sueloY) {
            cubo.y = sueloY;
            cubo.vy = 0;
            cubo.enSuelo = true;
        }

        // Mover Obstáculos y colisiones
        for (let i = obstaculos.length - 1; i >= 0; i--) {
            let obs = obstaculos[i];
            obs.x -= 6;

            if (colisionConObjeto(cubo, obs)) {
                if (obs.tipo === 'pinchoSuelo' || obs.tipo === 'pinchoTecho') {
                    gameOver = true;
                } else if (obs.tipo === 'bloque') {
                    if (cubo.vy > 0 && (cubo.y + cubo.alto - cubo.vy) <= obs.y + 10) {
                        cubo.y = obs.y - cubo.alto;
                        cubo.vy = 0;
                        cubo.enSuelo = true;
                    } else {
                        gameOver = true;
                    }
                }
            }

            if (obs.x + obs.ancho < 0) {
                obstaculos.splice(i, 1);
                score++;
            }
        }
    }

    function colisionConObjeto(r1, r2) {
        return !(r1.x > r2.x + r2.ancho ||
                 r1.x + r1.ancho < r2.x ||
                 r1.y > r2.y + r2.alto ||
                 r1.y + r1.alto < r2.y);
    }

    function dibujar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Fondo
        if (imgFondo.complete && imgFondo.naturalWidth !== 0) {
            ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);
        }

        // Línea Neon
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, sueloY + 40);
        ctx.lineTo(canvas.width, sueloY + 40);
        ctx.stroke();

        // Personaje
        if (imgJugador.complete && imgJugador.naturalWidth !== 0) {
            ctx.drawImage(imgJugador, cubo.x, cubo.y, cubo.ancho, cubo.alto);
        } else {
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(cubo.x, cubo.y, cubo.ancho, cubo.alto);
        }

        // Obstáculos
        obstaculos.forEach(obs => {
            if (obs.tipo === 'pinchoSuelo') {
                if (imgPincho.complete && imgPincho.naturalWidth !== 0) {
                    ctx.drawImage(imgPincho, obs.x, obs.y, obs.ancho, obs.alto);
                } else {
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.alto);
                    ctx.lineTo(obs.x + obs.ancho / 2, obs.y);
                    ctx.lineTo(obs.x + obs.ancho, obs.y + obs.alto);
                    ctx.fill();
                }
            } 
            else if (obs.tipo === 'pinchoTecho') {
                ctx.save();
                ctx.translate(obs.x + obs.ancho / 2, obs.y + obs.alto / 2);
                ctx.scale(1, -1);
                if (imgPincho.complete && imgPincho.naturalWidth !== 0) {
                    ctx.drawImage(imgPincho, -obs.ancho / 2, -obs.alto / 2, obs.ancho, obs.alto);
                } else {
                    ctx.fillStyle = '#ff0055';
                    ctx.beginPath();
                    ctx.moveTo(-obs.ancho / 2, -obs.alto / 2);
                    ctx.lineTo(0, obs.alto / 2);
                    ctx.lineTo(obs.ancho / 2, -obs.alto / 2);
                    ctx.fill();
                }
                ctx.restore();
            } 
            else if (obs.tipo === 'bloque') {
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(obs.x, obs.y, obs.ancho, obs.alto);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.ancho, obs.alto);
            } 
            else if (obs.tipo === 'esfera') {
                ctx.beginPath();
                ctx.arc(obs.x + obs.ancho/2, obs.y + obs.alto/2, obs.ancho/2, 0, Math.PI * 2);
                ctx.fillStyle = obs.usada ? '#555555' : '#ffee00';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        // Score e Instrucciones
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'left';
        ctx.fillText("SCORE: " + score, 20, 35);

        if (!juegoIniciado) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡HACÉ CLIC O TOCA PARA EMPEZAR!", canvas.width / 2, canvas.height / 2);
        } else if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡GAME OVER!", canvas.width / 2, canvas.height / 2);
            ctx.font = '20px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText("Hacé clic para volver a intentar", canvas.width / 2, canvas.height / 2 + 40);
        }

        actualizar();
        requestAnimationFrame(dibujar);
    }

    function reiniciarJuego() {
        cubo.y = sueloY;
        cubo.vy = 0;
        cubo.enSuelo = true;
        obstaculos = [];
        score = 0;
        frames = 0;
        gameOver = false;
        juegoIniciado = true;
    }

    // Iniciar bucle principal
    dibujar();
</script>

</body>
</html>
