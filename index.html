<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Dash Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #000;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Carga de imágenes con los nombres exactos de tu GitHub
    const imgFondo = new Image(); imgFondo.src = 'fondo.jpeg.jpeg';
    const imgJugador = new Image(); imgJugador.src = 'cubo.jpeg.jpeg';
    const imgPincho = new Image(); imgPincho.src = 'pincho.jpeg.jpeg';

    // Sistema de Audio
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Variables del juego
    let juegoIniciado = false;
    let gameOver = false;
    let score = 0;
    const sueloY = 310;

    // Jugador
    const cubo = {
        x: 80,
        y: sueloY,
        ancho: 40,
        alto: 40,
        vy: 0,
        gravedad: 0.8,
        fuerzaSalto: -13,
        enSuelo: true
    };

    let obstaculos = [];
    let frames = 0;

    // Controles (Teclado, Mouse y Pantalla Táctil)
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') interactuar();
    });
    canvas.addEventListener('mousedown', interactuar);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        interactuar();
    });

    function interactuar() {
        initAudio();
        if (!juegoIniciado || gameOver) {
            reiniciarJuego();
            return;
        }
        
        if (cubo.enSuelo) {
            cubo.vy = cubo.fuerzaSalto;
            cubo.enSuelo = false;
        } else {
            // Activar salto extra al tocar una esfera amarilla en el aire
            obstaculos.forEach(obs => {
                if (obs.tipo === 'esfera' && !obs.usada) {
                    if (colisionConObjeto(cubo, obs)) {
                        cubo.vy = cubo.fuerzaSalto * 1.1;
                        obs.usada = true;
                    }
                }
            });
        }
    }

    function crearObstaculo() {
        const opciones = ['pinchoSuelo', 'pinchoTecho', 'bloque', 'esfera'];
        const tipoElegido = opciones[Math.floor(Math.random() * opciones.length)];

        if (tipoElegido === 'pinchoSuelo') {
            obstaculos.push({ x: canvas.width, y: sueloY, ancho: 40, alto: 40, tipo: 'pinchoSuelo' });
        } 
        else if (tipoElegido === 'pinchoTecho') {
            obstaculos.push({ x: canvas.width, y: 0, ancho: 40, alto: 40, tipo: 'pinchoTecho' });
        } 
        else if (tipoElegido === 'bloque') {
            obstaculos.push({ x: canvas.width, y: sueloY - 40, ancho: 50, alto: 80, tipo: 'bloque' });
        } 
        else if (tipoElegido === 'esfera') {
            obstaculos.push({ x: canvas.width, y: sueloY - 90, ancho: 30, alto: 30, tipo: 'esfera', usada: false });
        }
    }

    function actualizar() {
        if (!juegoIniciado || gameOver) return;

        frames++;
        if (frames % 100 === 0) {
            crearObstaculo();
        }

        // Física del Cubo
        cubo.vy += cubo.gravedad;
        cubo.y += cubo.vy;

        // Colisión con el suelo principal
        if (cubo.y >= sueloY) {
            cubo.y = sueloY;
            cubo.vy = 0;
            cubo.enSuelo = true;
        }

        // Mover Obstáculos y detectar impacto
        obstaculos.forEach((obs, index) => {
            obs.x -= 5;

            if (colisionConObjeto(cubo, obs)) {
                if (obs.tipo === 'pinchoSuelo' || obs.tipo === 'pinchoTecho') {
                    gameOver = true;
                } else if (obs.tipo === 'bloque') {
                    // Caer sobre la plataforma del bloque
                    if (cubo.vy > 0 && (cubo.y + cubo.alto - cubo.vy) <= obs.y) {
                        cubo.y = obs.y - cubo.alto;
                        cubo.vy = 0;
                        cubo.enSuelo = true;
                    } else {
                        // Chocar contra el lateral
                        gameOver = true;
                    }
                }
            }

            // Eliminar obstáculos fuera de pantalla y sumar puntos
            if (obs.x + obs.ancho < 0) {
                obstaculos.splice(index, 1);
                score++;
            }
        });
    }

    function colisionConObjeto(r1, r2) {
        return !(r1.x > r2.x + r2.ancho ||
                 r1.x + r1.ancho < r2.x ||
                 r1.y > r2.y + r2.alto ||
                 r1.y + r1.alto < r2.y);
    }

    function dibujar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Renderizar Fondo
        if (imgFondo.complete) {
            ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);
        }

        // Renderizar Suelo Neon
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, sueloY + 40);
        ctx.lineTo(canvas.width, sueloY + 40);
        ctx.stroke();

        // Renderizar Jugador
        if (imgJugador.complete) {
            ctx.drawImage(imgJugador, cubo.x, cubo.y, cubo.ancho, cubo.alto);
        }

        // Renderizar Obstáculos
        obstaculos.forEach(obs => {
            if (obs.tipo === 'pinchoSuelo') {
                if (imgPincho.complete) ctx.drawImage(imgPincho, obs.x, obs.y, obs.ancho, obs.alto);
            } 
            else if (obs.tipo === 'pinchoTecho') {
                ctx.save();
                ctx.translate(obs.x + obs.ancho / 2, obs.y + obs.alto / 2);
                ctx.scale(1, -1);
                if (imgPincho.complete) ctx.drawImage(imgPincho, -obs.ancho / 2, -obs.alto / 2, obs.ancho, obs.alto);
                ctx.restore();
            } 
            else if (obs.tipo === 'bloque') {
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(obs.x, obs.y, obs.ancho, obs.alto);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.ancho, obs.alto);
            } 
            else if (obs.tipo === 'esfera') {
                ctx.beginPath();
                ctx.arc(obs.x + obs.ancho/2, obs.y + obs.alto/2, obs.ancho/2, 0, Math.PI * 2);
                ctx.fillStyle = obs.usada ? '#555555' : '#ffee00';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        // Interfaz de Usuario / Score
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'left';
        ctx.fillText("SCORE: " + score, 20, 30);

        if (!juegoIniciado) {
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡Toca la pantalla para empezar!", canvas.width / 2, canvas.height / 2);
        } else if (gameOver) {
            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡GAME OVER!", canvas.width / 2, canvas.height / 2);
            ctx.font = '18px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText("Toca para volver a intentar", canvas.width / 2, canvas.height / 2 + 40);
        }

        requestAnimationFrame(dibujar);
    }

    function reiniciarJuego() {
        cubo.y = sueloY;
        cubo.vy = 0;
        cubo.enSuelo = true;
        obstaculos = [];
        score = 0;
        frames = 0;
        gameOver = false;
        juegoIniciado = true;
    }

    // Iniciar bucle de renderizado
    dibujar();
</script>

</body>
</html>
