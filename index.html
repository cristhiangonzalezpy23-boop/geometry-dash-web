<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Dash Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0b12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            cursor: pointer;
        }
        canvas { width: 100%; height: 100%; display: block; background-color: #000; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Assets adaptados a tus nombres de archivo en GitHub
    const imgFondo = new Image(); imgFondo.src = 'fondo.jpeg.jpeg';
    const imgJugador = new Image(); imgJugador.src = 'cubo.jpeg.jpeg';
    const imgPincho = new Image(); imgPincho.src = 'pincho.jpeg.jpeg';

    // Audio Synthesizer (estilo 8-bit)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let musicaIniciada = false;

    function reproducirMusica() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (musicaIniciada) return;
        
        musicaIniciada = true;
        // Secuencia retro de fondo
        const notas = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let paso = 0;

        setInterval(() => {
            if (gameOver || !juegoIniciado || victoria) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notas[paso % notas.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
                paso++;
            } catch(e){}
        }, 160);
    }

    // Configuración base
    let juegoIniciado = false;
    let gameOver = false;
    let victoria = false;
    let avanceNivel = 0;
    const sueloY = 310;
    const velocidadJuego = 5.5;

    // Jugador (Cubo)
    const cubo = {
        x: 100,
        y: sueloY,
        ancho: 40,
        alto: 40,
        vy: 0,
        gravedad: 0.88, // Ajuste para mayor precisión
        fuerzaSalto: -13.8, // Ajuste para triple pincho
        enSuelo: true
    };

    // --- DISEÑO DE NIVEL FIJO Y JUGABLE ---
    const mapaNivelOriginal = [
        // Inicio
        { x: 700, tipo: 'pincho' },
        { x: 1100, tipo: 'pincho' },
        { x: 1400, tipo: 'pincho' }, { x: 1435, tipo: 'pincho' },
        
        // Primera plataforma individual
        { x: 1800, tipo: 'bloque', alto: 40 },
        
        // TRIPLE PINCHO CON ESFERA (Corrida a la izquierda: x=2150)
        { x: 2120, y: sueloY - 70, tipo: 'esfera' },
        { x: 2180, tipo: 'pincho' }, { x: 2215, tipo: 'pincho' }, { x: 2250, tipo: 'pincho' },

        // SECCIÓN DEL 56% CORREGIDA (Bloques pegados continua)
        { x: 2650, tipo: 'bloque', alto: 40 },
        { x: 2700, tipo: 'bloque', alto: 40 },
        { x: 2750, tipo: 'bloque', alto: 80 },
        { x: 2800, tipo: 'bloque', alto: 80 },
        { x: 2950, tipo: 'pincho' },
        
        // Tramo final
        { x: 3400, tipo: 'pincho' },
        { x: 3700, tipo: 'pincho' }, { x: 3735, tipo: 'pincho' },
        { x: 4050, y: sueloY - 70, tipo: 'esfera' },
        { x: 4100, tipo: 'pincho' }, { x: 4135, tipo: 'pincho' }, { x: 4170, tipo: 'pincho' },
        
        // META
        { x: 4600, tipo: 'meta' }
    ];

    let obstaculos = [];

    // Controles
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') interactuar(); });
    document.getElementById('gameContainer').addEventListener('mousedown', interactuar);
    document.getElementById('gameContainer').addEventListener('touchstart', (e) => { e.preventDefault(); interactuar(); });

    function interactuar() {
        reproducirMusica();
        if (!juegoIniciado || gameOver || victoria) {
            reiniciarJuego();
            return;
        }
        
        if (cubo.enSuelo) {
            cubo.vy = cubo.fuerzaSalto;
            cubo.enSuelo = false;
        } else {
            // Salto en esfera flotante
            obstaculos.forEach(obs => {
                if (obs.tipo === 'esfera' && !obs.usada) {
                    const centroEsferaX = obs.x + 20;
                    const centroEsferaY = obs.y + 20;
                    const cuboCentroX = cubo.x + cubo.ancho/2;
                    const cuboCentroY = cubo.y + cubo.alto/2;
                    
                    const dist = Math.hypot(cuboCentroX - centroEsferaX, cuboCentroY - centroEsferaY);
                    if (dist < 58) { // Mayor radio para que sea fácil tocarla
                        cubo.vy = cubo.fuerzaSalto * 1.1;
                        obs.usada = true;
                    }
                }
            });
        }
    }

    function actualizar() {
        if (!juegoIniciado || gameOver || victoria) return;

        avanceNivel += velocidadJuego;

        // Física Cubo (Pre-cálculo)
        cubo.vy += cubo.gravedad;
        let proximoY = cubo.y + cubo.vy;
        cubo.enSuelo = false;

        let pisandoAlgo = false;

        // Comprobar colisión con el suelo normal
        if (proximoY >= sueloY) {
            proximoY = sueloY;
            cubo.vy = 0;
            cubo.enSuelo = true;
            pisandoAlgo = true;
        }

        // --- SISTEMA DE FÍSICA Y COLISIONES CORREGIDO ---
        for (let i = 0; i < obstaculos.length; i++) {
            let obs = obstaculos[i];
            obs.x = obs.posXOriginal - avanceNivel; // Posición actual en pantalla

            if (obs.x > cubo.x + cubo.ancho + 50 || obs.x < cubo.x - 100) continue; // Optimización

            if (obs.tipo === 'pincho') {
                // Caja de colisión reducida y ajustada triangularmente (10px margen lateral superior)
                const margenLateral = 10;
                if (
                    cubo.x + margenLateral < obs.x + 35 &&
                    cubo.x + cubo.ancho - margenLateral > obs.x &&
                    proximoY + 8 < sueloY + 40 &&
                    proximoY + cubo.alto > sueloY
                ) {
                    gameOver = true;
                    break;
                }
            } 
            else if (obs.tipo === 'bloque') {
                const bloqueY = sueloY + 40 - obs.alto;
                
                // Comprobar si está ENFRENTADO horizontalmente
                const colisionH = (cubo.x + cubo.ancho > obs.x + 2) && (cubo.x < obs.x + 48);
                const colisionV = (proximoY + cubo.alto > bloqueY + 4) && (proximoY < sueloY + 40);

                if (colisionH && colisionV) {
                    // Caer ARRIBA de la plataforma
                    if (cubo.vy >= 0 && proximoY + cubo.alto - cubo.vy <= bloqueY + 16) {
                        proximoY = bloqueY - cubo.alto;
                        cubo.vy = 0;
                        cubo.enSuelo = true;
                        pisandoAlgo = true;
                    } else {
                        // Choque lateral (Muerte instantánea)
                        gameOver = true;
                        break;
                    }
                }
            }
            else if (obs.tipo === 'meta') {
                if (cubo.x >= obs.x) {
                    victoria = true;
                    break;
                }
            }
        }

        if (gameOver) return; // Parar físicas al instante

        cubo.y = proximoY; // Aplicar posición final
    }

    function dibujar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Fondo
        if (imgFondo.complete && imgFondo.naturalWidth !== 0) {
            ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);
        }

        // Suelo Neon (Línea celeste)
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, sueloY + 40);
        ctx.lineTo(canvas.width, sueloY + 40);
        ctx.stroke();

        // Renderizar Obstáculos
        obstaculos.forEach(obs => {
            // Solo dibujar si está cerca de la pantalla
            if (obs.x > -100 && obs.x < canvas.width + 100) {
                if (obs.tipo === 'pincho') {
                    if (imgPincho.complete && imgPincho.naturalWidth !== 0) {
                        ctx.drawImage(imgPincho, obs.x, sueloY, 35, 40);
                    } else {
                        // Respaldo visual (pincho rojo)
                        ctx.fillStyle = '#ff0055';
                        ctx.beginPath();
                        ctx.moveTo(obs.x, sueloY + 40);
                        ctx.lineTo(obs.x + 17.5, sueloY);
                        ctx.lineTo(obs.x + 35, sueloY + 40);
                        ctx.fill();
                    }
                } 
                else if (obs.tipo === 'bloque') {
                    const bloqueY = sueloY + 40 - obs.alto;
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(obs.x, bloqueY, 50, obs.alto);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, bloqueY, 50, obs.alto);
                }
                else if (obs.tipo === 'esfera') {
                    ctx.beginPath();
                    ctx.arc(obs.x + 20, obs.y + 20, 15, 0, Math.PI * 2);
                    ctx.fillStyle = obs.usada ? '#555555' : '#ffee00';
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        });

        // Personaje (Cubo)
        if (imgJugador.complete && imgJugador.naturalWidth !== 0) {
            ctx.drawImage(imgJugador, cubo.x, cubo.y, cubo.ancho, cubo.alto);
        } else {
            // Respaldo visual
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(cubo.x, cubo.y, cubo.ancho, cubo.alto);
        }

        // Progreso %
        const porcentaje = Math.min(100, Math.floor((avanceNivel / 4600) * 100));
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(porcentaje + "%", 20, 35);

        // Carteles de Estado
        if (!juegoIniciado) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡NIVEL 1 - TOCA PARA EMPEZAR!", canvas.width / 2, canvas.height / 2);
        } else if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 38px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡GAME OVER!", canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '18px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText("Hacé clic para reintentar", canvas.width / 2, canvas.height / 2 + 30);
        } else if (victoria) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡NIVEL COMPLETADO! 🎉", canvas.width / 2, canvas.height / 2);
        }

        actualizar();
        requestAnimationFrame(dibujar);
    }

    function reiniciarJuego() {
        cubo.y = sueloY;
        cubo.vy = 0;
        cubo.enSuelo = true;
        avanceNivel = 0;
        gameOver = false;
        victoria = false;
        
        // Clonar mapa del nivel
        obstaculos = mapaNivelOriginal.map(item => ({
            ...item,
            posXOriginal: item.x,
            y: item.y || sueloY,
            usada: false
        }));
        
        juegoIniciado = true;
    }

    // Iniciar bucle principal
    dibujar();
</script>

</body>
</html>
