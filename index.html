<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geometry Dash Web - Música por Nivel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0b0b12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            cursor: pointer;
        }
        canvas { width: 100%; height: 100%; display: block; background-color: #000; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const imgFondo = new Image(); imgFondo.src = 'fondo.jpeg.jpeg';
    const imgJugador = new Image(); imgJugador.src = 'cubo.jpeg.jpeg';
    const imgPincho = new Image(); imgPincho.src = 'pincho.jpeg.jpeg';

    // --- SISTEMA DE AUDIO DINÁMICO POR NIVEL ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let intervaloMusica = null;
    let pasoNota = 0;

    function detenerMusica() {
        if (intervaloMusica) {
            clearInterval(intervaloMusica);
            intervaloMusica = null;
        }
    }

    function iniciarMusicaNivel() {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        detenerMusica();
        pasoNota = 0;

        const configAudio = niveles[nivelActualIndex].audio;

        intervaloMusica = setInterval(() => {
            if (gameOver || !juegoIniciado || victoria) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = configAudio.onda || 'sawtooth';
                const frecuencia = configAudio.notas[pasoNota % configAudio.notas.length];

                osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
                pasoNota++;
            } catch(e){}
        }, configAudio.tempo);
    }

    let nivelActualIndex = 0;
    let juegoIniciado = false;
    let gameOver = false;
    let victoria = false;
    let avanceNivel = 0;
    const sueloY = 310;
    const velocidadJuego = 5.5;

    const cubo = {
        x: 100,
        y: sueloY,
        ancho: 40,
        alto: 40,
        vy: 0,
        gravedad: 0.88,
        fuerzaSalto: -13.8,
        enSuelo: true
    };

    function generarMapaExtremo(longitudTotal, densidad) {
        let mapa = [];
        let x = 500;
        
        while (x < longitudTotal - 400) {
            let patron = Math.floor(Math.random() * 5);

            if (patron === 0) {
                mapa.push({ x: x, tipo: 'pincho' });
                if (densidad > 1) mapa.push({ x: x + 35, tipo: 'pincho' });
                x += 350 - (densidad * 20);
            } else if (patron === 1) {
                mapa.push({ x: x, tipo: 'bloque', alto: 40 });
                mapa.push({ x: x + 50, tipo: 'bloque', alto: 40 });
                if (densidad > 2) mapa.push({ x: x + 100, tipo: 'bloque', alto: 40 });
                x += 400 - (densidad * 15);
            } else if (patron === 2) {
                mapa.push({ x: x, tipo: 'bloque', alto: 40 });
                mapa.push({ x: x + 50, tipo: 'pincho' });
                x += 380 - (densidad * 20);
            } else if (patron === 3) {
                mapa.push({ x: x, tipo: 'pincho' });
                mapa.push({ x: x + 220, tipo: 'pincho' });
                x += 420 - (densidad * 15);
            } else {
                mapa.push({ x: x, tipo: 'bloque', alto: 40 });
                mapa.push({ x: x + 50, tipo: 'bloque', alto: 40 });
                mapa.push({ x: x + 100, tipo: 'bloque', alto: 40 });
                mapa.push({ x: x + 150, tipo: 'pincho' });
                x += 450 - (densidad * 20);
            }
        }

        mapa.push({ x: longitudTotal, tipo: 'meta' });
        return mapa;
    }

    // --- 10 NIVELES CON MÚSICA DIVERSIFICADA Y PROGRESIVA ---
    const niveles = [
        { 
            nombre: "NIVEL 1 - DESPERTARES", 
            longitud: 4500, 
            mapa: generarMapaExtremo(4500, 1),
            audio: { tempo: 180, onda: 'triangle', notas: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63] } // Melódico suave
        },
        { 
            nombre: "NIVEL 2 - RITMO ACELERADO", 
            longitud: 5500, 
            mapa: generarMapaExtremo(5500, 1.5),
            audio: { tempo: 160, onda: 'square', notas: [220.00, 277.18, 329.63, 440.00, 329.63, 277.18] } // Electrónico alegre
        },
        { 
            nombre: "NIVEL 3 - SIN DESCANSO", 
            longitud: 6500, 
            mapa: generarMapaExtremo(6500, 2),
            audio: { tempo: 150, onda: 'sawtooth', notas: [293.66, 349.23, 440.00, 587.33, 440.00, 349.23] } // Agudo y rápido
        },
        { 
            nombre: "NIVEL 4 - TRAMPAS CONTINUAS", 
            longitud: 7500, 
            mapa: generarMapaExtremo(7500, 2.5),
            audio: { tempo: 140, onda: 'sawtooth', notas: [196.00, 246.94, 293.66, 392.00, 293.66, 246.94] } // Bajo rítmico
        },
        { 
            nombre: "NIVEL 5 - ZONA DE IMPACTO", 
            longitud: 8500, 
            mapa: generarMapaExtremo(8500, 3),
            audio: { tempo: 130, onda: 'square', notas: [174.61, 220.00, 261.63, 349.23, 261.63, 220.00] } // Oscuro y potente
        },
        { 
            nombre: "NIVEL 6 - REFLEJOS PUROS", 
            longitud: 9500, 
            mapa: generarMapaExtremo(9500, 3.5),
            audio: { tempo: 120, onda: 'sawtooth', notas: [329.63, 392.00, 493.88, 659.25, 493.88, 392.00] } // Alta frecuencia
        },
        { 
            nombre: "NIVEL 7 - PESADILLA DE PINCHOS", 
            longitud: 10500, 
            mapa: generarMapaExtremo(10500, 4),
            audio: { tempo: 110, onda: 'sawtooth', notas: [146.83, 174.61, 220.00, 293.66, 220.00, 174.61] } // Tensión grave
        },
        { 
            nombre: "NIVEL 8 - RUTA CAÓTICA", 
            longitud: 11500, 
            mapa: generarMapaExtremo(11500, 4.5),
            audio: { tempo: 100, onda: 'square', notas: [261.63, 311.13, 392.00, 523.25, 392.00, 311.13] } // Escala menor rápida
        },
        { 
            nombre: "NIVEL 9 - CASI IMPOSIBLE", 
            longitud: 12500, 
            mapa: generarMapaExtremo(12500, 5),
            audio: { tempo: 90, onda: 'sawtooth', notas: [130.81, 155.56, 196.00, 261.63, 196.00, 155.56] } // Súper rápido y grave
        },
        { 
            nombre: "NIVEL 10 - DEMON FINAL", 
            longitud: 14000, 
            mapa: generarMapaExtremo(14000, 6),
            audio: { tempo: 80, onda: 'sawtooth', notas: [110.00, 130.81, 164.81, 220.00, 293.66, 329.63, 440.00] } // MÓDULO FINAL DEMON
        }
    ];

    let obstaculos = [];

    window.addEventListener('keydown', (e) => { if (e.code === 'Space') interactuar(); });
    document.getElementById('gameContainer').addEventListener('mousedown', interactuar);
    document.getElementById('gameContainer').addEventListener('touchstart', (e) => { e.preventDefault(); interactuar(); });

    function cargarNivel(index) {
        const nivel = niveles[index];
        obstaculos = nivel.mapa.map(item => ({
            ...item,
            posXOriginal: item.x,
            y: item.y || sueloY
        }));
    }

    function interactuar() {
        if (!juegoIniciado) {
            reiniciarJuego();
            return;
        }
        if (gameOver) {
            reiniciarJuego();
            return;
        }
        if (victoria) {
            if (nivelActualIndex === niveles.length - 1) {
                nivelActualIndex = 0;
            } else {
                nivelActualIndex++;
            }
            reiniciarJuego();
            return;
        }
        if (cubo.enSuelo) {
            cubo.vy = cubo.fuerzaSalto;
            cubo.enSuelo = false;
        }
    }

    function actualizar() {
        if (!juegoIniciado || gameOver || victoria) return;
        avanceNivel += velocidadJuego;
        cubo.vy += cubo.gravedad;
        let proximoY = cubo.y + cubo.vy;
        cubo.enSuelo = false;

        if (proximoY >= sueloY) {
            proximoY = sueloY;
            cubo.vy = 0;
            cubo.enSuelo = true;
        }

        for (let i = 0; i < obstaculos.length; i++) {
            let obs = obstaculos[i];
            obs.x = obs.posXOriginal - avanceNivel;

            if (obs.x > cubo.x + 100 || obs.x < cubo.x - 100) continue;

            if (obs.tipo === 'pincho') {
                if (
                    cubo.x + 8 < obs.x + 30 &&
                    cubo.x + cubo.ancho - 8 > obs.x + 5 &&
                    proximoY + 10 < sueloY + 40 &&
                    proximoY + cubo.alto > sueloY
                ) {
                    gameOver = true;
                    detenerMusica();
                    break;
                }
            } else if (obs.tipo === 'bloque') {
                const bloqueY = sueloY + 40 - obs.alto;
                const colisionH = (cubo.x + cubo.ancho > obs.x + 2) && (cubo.x < obs.x + 48);
                const colisionV = (proximoY + cubo.alto > bloqueY + 4) && (proximoY < sueloY + 40);

                if (colisionH && colisionV) {
                    if (cubo.vy >= 0 && proximoY + cubo.alto - cubo.vy <= bloqueY + 16) {
                        proximoY = bloqueY - cubo.alto;
                        cubo.vy = 0;
                        cubo.enSuelo = true;
                    } else {
                        gameOver = true;
                        detenerMusica();
                        break;
                    }
                }
            } else if (obs.tipo === 'meta') {
                if (cubo.x >= obs.x) {
                    victoria = true;
                    detenerMusica();
                    break;
                }
            }
        }

        if (gameOver) return;
        cubo.y = proximoY;
    }

    function dibujar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (imgFondo.complete && imgFondo.naturalWidth !== 0) {
            ctx.drawImage(imgFondo, 0, 0, canvas.width, canvas.height);
        }

        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, sueloY + 40);
        ctx.lineTo(canvas.width, sueloY + 40);
        ctx.stroke();

        obstaculos.forEach(obs => {
            if (obs.x > -100 && obs.x < canvas.width + 100) {
                if (obs.tipo === 'pincho') {
                    if (imgPincho.complete && imgPincho.naturalWidth !== 0) {
                        ctx.drawImage(imgPincho, obs.x, sueloY, 35, 40);
                    } else {
                        ctx.fillStyle = '#ff0055';
                        ctx.beginPath();
                        ctx.moveTo(obs.x, sueloY + 40);
                        ctx.lineTo(obs.x + 17.5, sueloY);
                        ctx.lineTo(obs.x + 35, sueloY + 40);
                        ctx.fill();
                    }
                } else if (obs.tipo === 'bloque') {
                    const bloqueY = sueloY + 40 - obs.alto;
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(obs.x, bloqueY, 50, obs.alto);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, bloqueY, 50, obs.alto);
                }
            }
        });

        if (imgJugador.complete && imgJugador.naturalWidth !== 0) {
            ctx.drawImage(imgJugador, cubo.x, cubo.y, cubo.ancho, cubo.alto);
        } else {
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(cubo.x, cubo.y, cubo.ancho, cubo.alto);
        }

        const nivelActual = niveles[nivelActualIndex];
        const porcentajeVal = victoria ? 100 : Math.min(100, Math.floor((avanceNivel / nivelActual.longitud) * 100));
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(nivelActual.nombre + " - " + porcentajeVal + "%", 20, 35);

        if (!juegoIniciado) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡TOCA PARA EMPEZAR!", canvas.width / 2, canvas.height / 2 - 15);
            ctx.font = '18px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(nivelActual.nombre, canvas.width / 2, canvas.height / 2 + 25);
        } else if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 38px Arial';
            ctx.textAlign = 'center';
            ctx.fillText("¡GAME OVER!", canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '18px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText("Toca para reintentar", canvas.width / 2, canvas.height / 2 + 30);
        } else if (victoria) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            
            if (nivelActualIndex === niveles.length - 1) {
                ctx.fillText("¡SOS UN CRACK! 🎉", canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = '18px Arial';
                ctx.fillStyle = '#ffffff';
                ctx.fillText("Completaste todos los niveles modo extremo", canvas.width / 2, canvas.height / 2 + 25);
            } else {
                ctx.fillText("¡NIVEL COMPLETADO! 🎉", canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = '18px Arial';
                ctx.fillStyle = '#ffffff';
                ctx.fillText("Toca para pasar al siguiente nivel", canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        actualizar();
        requestAnimationFrame(dibujar);
    }

    function reiniciarJuego() {
        cubo.y = sueloY;
        cubo.vy = 0;
        cubo.enSuelo = true;
        avanceNivel = 0;
        gameOver = false;
        victoria = false;
        
        cargarNivel(nivelActualIndex);
        juegoIniciado = true;
        iniciarMusicaNivel();
    }

    dibujar();
</script>

</body>
</html>
